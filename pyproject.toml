[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-agentic-notification-router"
version = "0.1.0"
description = "Personalized WhatsApp notification routing with agentic evidence retrieval"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings",
    "openai-agents",
    "openai>=1.40",
    "groq>=0.11",
    "instructor>=1.4",
    "google-genai>=0.3",
    "jsonref>=1.1",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pandas>=2.2",  # scripts/audit_op.py only
    "pytest>=8.0",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
notification-router = "notification_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
